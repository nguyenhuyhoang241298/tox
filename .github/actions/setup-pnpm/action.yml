name: "Setup pnpm"
description: "Cài Node + pnpm theo .tool-versions ở gốc repo, rồi cài dependency cho một thư mục"

inputs:
  working-directory:
    description: "Thư mục chứa package.json và pnpm-lock.yaml (web hoặc backend)"
    required: true

runs:
  using: composite
  steps:
    - name: Extract versions from .tool-versions
      id: versions
      shell: bash
      run: |
        PNPM_VERSION=$(grep 'pnpm' .tool-versions | awk '{print $2}')
        NODE_VERSION=$(grep 'nodejs' .tool-versions | awk '{print $2}')
        echo "pnpm=$PNPM_VERSION" >> $GITHUB_OUTPUT
        echo "node=$NODE_VERSION" >> $GITHUB_OUTPUT

    - name: Setup pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
      with:
        version: ${{ steps.versions.outputs.pnpm }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.versions.outputs.node }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
